# olmOCR Development Docker Compose (No GPU)
# Usage: docker-compose -f docker-compose.dev.yml up -d
#
# Simplified setup for frontend/backend development without GPU worker.
# Use this for UI development and API testing.

version: '3.8'

services:
  # Frontend - React development server with hot reload
  frontend:
    build:
      context: ./gcp-frontend
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000/api
      - VITE_FIREBASE_API_KEY=${VITE_FIREBASE_API_KEY:-demo-key}
      - VITE_FIREBASE_AUTH_DOMAIN=${VITE_FIREBASE_AUTH_DOMAIN:-demo.firebaseapp.com}
      - VITE_FIREBASE_PROJECT_ID=${VITE_FIREBASE_PROJECT_ID:-demo-project}
    volumes:
      - ./gcp-frontend/src:/app/src
      - ./gcp-frontend/public:/app/public
    depends_on:
      - backend
    networks:
      - olmocr-dev

  # Backend - FastAPI with auto-reload
  backend:
    build:
      context: ./gcp-backend
      dockerfile: Dockerfile.dev
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - DEBUG=true
      - LOG_LEVEL=DEBUG
      - GCP_PROJECT_ID=local-dev
      - GCS_BUCKET=olmocr-local
      - PUBSUB_EMULATOR_HOST=pubsub-emulator:8085
      - FIRESTORE_EMULATOR_HOST=firestore-emulator:8080
      - CORS_ORIGINS=http://localhost:5173,http://localhost:3000
    volumes:
      - ./gcp-backend:/app
      - local-storage:/data/storage
    depends_on:
      - pubsub-emulator
      - firestore-emulator
    networks:
      - olmocr-dev

  # Pub/Sub Emulator
  pubsub-emulator:
    image: gcr.io/google.com/cloudsdktool/cloud-sdk:latest
    command: gcloud beta emulators pubsub start --host-port=0.0.0.0:8085
    ports:
      - "8085:8085"
    networks:
      - olmocr-dev

  # Firestore Emulator
  firestore-emulator:
    image: gcr.io/google.com/cloudsdktool/cloud-sdk:latest
    command: gcloud emulators firestore start --host-port=0.0.0.0:8080
    ports:
      - "8081:8080"
    networks:
      - olmocr-dev

networks:
  olmocr-dev:
    driver: bridge

volumes:
  local-storage:
