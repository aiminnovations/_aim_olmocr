apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: olmocr-worker-hpa
  namespace: olmocr
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: olmocr-worker
  minReplicas: 0
  maxReplicas: 10
  metrics:
  # Scale based on Pub/Sub queue depth
  - type: External
    external:
      metric:
        name: pubsub.googleapis.com|subscription|num_undelivered_messages
        selector:
          matchLabels:
            resource.labels.subscription_id: olmocr-jobs-sub
      target:
        type: AverageValue
        averageValue: "5"
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Pods
        value: 1
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Pods
        value: 2
        periodSeconds: 60
