# Cloud Build configuration for olmOCR - Cloud Run deployment (Parasail API mode)
#
# This deploys all services to Cloud Run using Parasail API for OCR processing.
# No GPU infrastructure required.
#
# Usage:
#   gcloud builds submit --config gcp-deployment/cloudrun/cloudbuild.yaml .
#
# Prerequisites:
#   1. Store Parasail API key in Secret Manager:
#      echo -n "psk-xxx" | gcloud secrets create parasail-api-key --data-file=-
#   2. Enable required APIs (run setup-resources.sh first)

timeout: '3600s'

substitutions:
  _REGION: us-central1
  _BUCKET_NAME: olmocr-${PROJECT_ID}

steps:
  # ============================================
  # Build Stage (parallel)
  # ============================================

  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-frontend'
    args:
      - 'build'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/olmocr/frontend:${SHORT_SHA}'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/olmocr/frontend:latest'
      - '-f'
      - 'gcp-frontend/Dockerfile'
      - '.'

  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-backend'
    args:
      - 'build'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/olmocr/backend:${SHORT_SHA}'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/olmocr/backend:latest'
      - '-f'
      - 'gcp-backend/Dockerfile'
      - '.'
    waitFor: ['-']

  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-worker'
    args:
      - 'build'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/olmocr/worker:${SHORT_SHA}'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/olmocr/worker:latest'
      - '-f'
      - 'gcp-worker/Dockerfile.cloudrun'
      - '.'
    waitFor: ['-']

  # ============================================
  # Push Stage
  # ============================================

  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-frontend'
    args: ['push', '--all-tags', '${_REGION}-docker.pkg.dev/${PROJECT_ID}/olmocr/frontend']
    waitFor: ['build-frontend']

  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-backend'
    args: ['push', '--all-tags', '${_REGION}-docker.pkg.dev/${PROJECT_ID}/olmocr/backend']
    waitFor: ['build-backend']

  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-worker'
    args: ['push', '--all-tags', '${_REGION}-docker.pkg.dev/${PROJECT_ID}/olmocr/worker']
    waitFor: ['build-worker']

  # ============================================
  # Deploy Stage
  # ============================================

  # Deploy Frontend
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-frontend'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'olmocr-frontend'
      - '--image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/olmocr/frontend:${SHORT_SHA}'
      - '--region=${_REGION}'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=8080'
      - '--cpu=1'
      - '--memory=256Mi'
      - '--min-instances=0'
      - '--max-instances=10'
    waitFor: ['push-frontend']

  # Deploy Backend
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-backend'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'olmocr-backend'
      - '--image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/olmocr/backend:${SHORT_SHA}'
      - '--region=${_REGION}'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=8080'
      - '--cpu=1'
      - '--memory=512Mi'
      - '--min-instances=0'
      - '--max-instances=20'
      - '--set-env-vars=GCP_PROJECT_ID=${PROJECT_ID},GCS_BUCKET=${_BUCKET_NAME},PUBSUB_TOPIC=olmocr-jobs,ENVIRONMENT=production'
    waitFor: ['push-backend']

  # Deploy Worker
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-worker'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'olmocr-worker'
      - '--image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/olmocr/worker:${SHORT_SHA}'
      - '--region=${_REGION}'
      - '--platform=managed'
      - '--no-allow-unauthenticated'
      - '--port=8080'
      - '--cpu=2'
      - '--memory=2Gi'
      - '--min-instances=0'
      - '--max-instances=10'
      - '--timeout=600'
      - '--set-env-vars=GCP_PROJECT_ID=${PROJECT_ID},GCS_BUCKET=${_BUCKET_NAME},PROCESSING_MODE=parasail,PARASAIL_MODEL=allenai/olmOCR-2-7B-1025'
      - '--set-secrets=PARASAIL_API_KEY=parasail-api-key:latest'
    waitFor: ['push-worker']

  # ============================================
  # Configure Pub/Sub Push Subscription
  # ============================================
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'configure-pubsub'
    entrypoint: bash
    args:
      - '-c'
      - |
        # Get worker URL
        WORKER_URL=$(gcloud run services describe olmocr-worker --region=${_REGION} --format='value(status.url)')

        # Create or update push subscription
        if gcloud pubsub subscriptions describe olmocr-jobs-push --project=${PROJECT_ID} 2>/dev/null; then
          echo "Updating existing push subscription..."
          gcloud pubsub subscriptions modify-push-config olmocr-jobs-push \
            --push-endpoint="$${WORKER_URL}/process" \
            --push-auth-service-account="pubsub-invoker@${PROJECT_ID}.iam.gserviceaccount.com"
        else
          echo "Creating push subscription..."
          gcloud pubsub subscriptions create olmocr-jobs-push \
            --topic=olmocr-jobs \
            --push-endpoint="$${WORKER_URL}/process" \
            --push-auth-service-account="pubsub-invoker@${PROJECT_ID}.iam.gserviceaccount.com" \
            --ack-deadline=600
        fi

        echo "Pub/Sub push subscription configured: $${WORKER_URL}/process"
    waitFor: ['deploy-worker']

images:
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/olmocr/frontend:${SHORT_SHA}'
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/olmocr/frontend:latest'
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/olmocr/backend:${SHORT_SHA}'
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/olmocr/backend:latest'
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/olmocr/worker:${SHORT_SHA}'
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/olmocr/worker:latest'

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'
