# cloudbuild.yaml

steps:
# Step 1: Build the Docker image
- name: 'gcr.io/cloud-builders/docker'
  id: Build
  args:
    - 'build'
    - '-t'
    - 'gcr.io/${PROJECT_ID}/ocr-webapp:latest'
    - '.' # Build from the current directory (root of the repo)

# Step 2: Push the Docker image to Artifact Registry (or Container Registry)
- name: 'gcr.io/cloud-builders/docker'
  id: Push
  args:
    - 'push'
    - 'gcr.io/${PROJECT_ID}/ocr-webapp:latest'

# Step 3: Deploy the image to Cloud Run
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
  id: Deploy
  entrypoint: gcloud
  args:
    - 'run'
    - 'deploy'
    - 'ocr-webapp-service' # Name of your Cloud Run service
    - '--image'
    - 'gcr.io/${PROJECT_ID}/ocr-webapp:latest'
    - '--region'
    - '${_REGION}' # Use the region defined in your Cloud Build trigger
    - '--platform'
    - 'managed'
    - '--service-account'
    - 'ocr-webapp-sa@${PROJECT_ID}.iam.gserviceaccount.com' # The service account created by gcloud
    - '--allow-unauthenticated' # Allow public access (handled by LB)
    - '--set-env-vars=PARASAIL_API_KEY=projects/${PROJECT_ID}/secrets/parasail-api-key/versions/latest' # Inject secret
    - '--port=8000'
    - '--max-instances=10'
    - '--min-instances=0'
    - '--no-cpu-throttling'
    - '--cpu=1'
    - '--memory=512Mi' # Adjust resources as needed
  env:
    - 'CLOUDSDK_CORE_PROJECT=${PROJECT_ID}'

# Define substitutions for region (will be set in the trigger)
substitutions:
  _REGION: us-central1 # Default region, will be overridden by trigger